<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Features</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #f4f4f2; color: #222; }
  header { position: sticky; top: 0; background: #222; color: #eee; padding: 10px 16px; display: flex; gap: 16px; align-items: center; z-index: 2; }
  header a { color: #9cf; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h2 { margin: 26px 0 8px; }
  .f { background: #fff; border: 1px solid #ddd; border-left: 6px solid #ccc; border-radius: 6px; padding: 10px 14px; margin: 6px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .f.keep { border-left-color: #3a3; } .f.maybe { border-left-color: #c90; } .f.drop { border-left-color: #c33; opacity: .55; }
  .name { font-weight: 600; } .tag { font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; font-weight: 400; }
  .tag.current { background: #e3e8f0; } .tag.new { background: #dff3df; }
  .desc { color: #555; grid-column: 1; }
  .choice { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; align-items: start; }
  .choice button { border: 1px solid #ccc; background: #fff; padding: 3px 9px; border-radius: 4px; cursor: pointer; }
  .choice button.on { background: #222; color: #fff; border-color: #222; }
  .note { grid-column: 1 / -1; width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; border: 1px solid #e3e3e3; border-radius: 4px; }
  textarea#extra { width: 100%; height: 80px; font: inherit; padding: 6px; box-sizing: border-box; }
</style>
</head>
<body>
<header><strong>Features</strong><span id="progress"></span><a href="/">← planning home</a><span style="font-size:12px;color:#aaa">Saves automatically.</span></header>
<main>
  <div id="list"></div>
  <h2>Anything else you want</h2>
  <textarea id="extra" placeholder="Features not on the list…"></textarea>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let review = {}, all = [];
const save = (id, value) => { review[id] = value; fetch("/review", { method: "POST", body: JSON.stringify({ id, value }) }); progress(); };
const progress = () => { const n = all.filter((f) => review[f.id]?.choice).length; $("#progress").textContent = `${n} / ${all.length} decided`; };
Promise.all([fetch("/features.json").then((r) => r.json()), fetch("/review").then((r) => r.json())]).then(([groups, r]) => {
  review = r;
  $("#extra").value = review._extra?.note ?? "";
  $("#extra").oninput = (e) => save("_extra", { note: e.target.value });
  for (const g of groups) {
    $("#list").insertAdjacentHTML("beforeend", `<h2>${esc(g.group)}</h2>`);
    for (const f of g.items) {
      all.push(f);
      const v = review[f.id] ?? {};
      const el = document.createElement("div");
      el.className = "f " + (v.choice ?? "");
      el.innerHTML = `<div class="name">${esc(f.name)}<span class="tag ${f.status}">${f.status === "new" ? "proposed" : "exists today"}</span></div>
        <div class="choice">${["keep", "maybe", "drop"].map((c) => `<button data-c="${c}" class="${v.choice === c ? "on" : ""}">${c}</button>`).join("")}</div>
        <div class="desc">${esc(f.desc)}</div>
        <input class="note" placeholder="note" value="${esc(v.note)}">`;
      el.querySelectorAll("button").forEach((b) => (b.onclick = () => {
        const cur = review[f.id] ?? {};
        const choice = cur.choice === b.dataset.c ? null : b.dataset.c;
        save(f.id, { ...cur, choice });
        el.className = "f " + (choice ?? "");
        el.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.c === choice));
      }));
      el.querySelector(".note").oninput = (e) => save(f.id, { ...(review[f.id] ?? {}), note: e.target.value });
      $("#list").appendChild(el);
    }
  }
  progress();
});
</script>
</body>
</html>
