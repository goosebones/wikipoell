<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Index</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif}.mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="bg-[#f6f6f4] text-neutral-900 antialiased text-[13px]">
<header class="bg-white border-b border-neutral-200 sticky top-0 z-20">
  <div class="px-4 h-12 flex items-center gap-4">
    <a href="#" class="font-semibold">Wikipoell <span class="text-neutral-400 font-normal">Index</span></a>
    <input placeholder="Search by model, code, title…  e.g. LM/2699 BIMS" class="flex-1 max-w-xl mono text-[12px] border border-neutral-300 rounded px-3 py-1.5 outline-none focus:border-neutral-500">
    <div class="flex-1"></div>
    <div class="flex text-[12px] border border-neutral-300 rounded overflow-hidden"><button id="vList" class="px-3 py-1 bg-neutral-900 text-white">List</button><button id="vGrid" class="px-3 py-1">Grid</button></div>
    <a href="#" class="text-[12px] bg-neutral-900 text-white rounded px-3 py-1.5">Submit garment</a>
  </div>
</header>

<div class="flex">
  <aside class="hidden md:block w-64 shrink-0 bg-white border-r border-neutral-200 h-[calc(100vh-48px)] sticky top-12 overflow-y-auto p-4 space-y-6" id="filters"></aside>
  <main class="flex-1 min-w-0 p-4">
    <div class="flex items-center gap-3 mb-3">
      <h1 class="text-lg font-semibold">All garments</h1>
      <span id="shown" class="text-neutral-500"></span>
      <div class="flex-1"></div>
      <span class="text-neutral-500">Sort</span>
      <select class="border border-neutral-300 rounded px-2 py-1 bg-white"><option>Model number</option><option>Newest</option></select>
    </div>
    <div id="list" class="bg-white border border-neutral-200 rounded"></div>
  </main>
</div>

<div id="detail" class="hidden fixed inset-y-0 right-0 z-30 w-full max-w-2xl bg-white border-l border-neutral-200 shadow-2xl overflow-y-auto">
  <div class="p-5">
    <div class="flex items-center justify-between"><p id="d-cat" class="text-neutral-500"></p><button id="close" class="text-neutral-500 hover:text-black text-lg">✕</button></div>
    <h2 id="d-title" class="text-2xl font-semibold mt-1"></h2>
    <div id="d-code" class="mono mt-2 inline-block bg-neutral-100 rounded px-2 py-1 text-[12px]"></div>
    <div id="d-images" class="flex gap-2 overflow-x-auto mt-4 pb-2"></div>
    <table id="d-attrs" class="w-full mt-4 border-t border-neutral-200"></table>
    <a id="d-source" target="_blank" class="inline-block mt-4 text-blue-700 hover:underline"></a>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let D, view = "list", active = {};
const row = (k, v) => v && v.length ? `<tr class="border-b border-neutral-100 align-top"><td class="py-2 pr-4 text-neutral-500 w-28">${k}</td><td class="py-2">${[].concat(v).map((x) => `<a href="#" class="hover:underline">${x}</a>`).join(" <span class='text-neutral-300'>›</span> ")}</td></tr>` : "";
function tree(title, key, items) {
  return `<div><p class="text-[11px] font-semibold uppercase tracking-wide text-neutral-500 mb-1">${title}</p>${items.map((i) => `
    <details class="group"><summary class="flex items-center gap-2 py-0.5 cursor-pointer list-none"><span class="text-neutral-400 text-[10px] w-3 group-open:rotate-90 transition">${i.children.length ? "▶" : ""}</span>
      <input type="checkbox" data-k="${key}" value="${i.label}" onclick="event.stopPropagation()"> <span class="flex-1">${i.label}</span><span class="mono text-[11px] text-neutral-400">${i.n}</span></summary>
      <div class="pl-9 text-neutral-500 text-[12px] leading-5">${i.children.slice(0, 8).map((c) => `<label class="flex gap-2"><input type="checkbox">${c}</label>`).join("")}${i.children.length > 8 ? `<span class="text-neutral-400">+ ${i.children.length - 8} more</span>` : ""}</div></details>`).join("")}</div>`;
}
function render() {
  const list = D.garments.filter((g) => Object.entries(active).every(([k, s]) => !s.size || s.has(g[k][0])));
  $("#shown").textContent = `${list.length} of ${D.counts.garments.toLocaleString()} (sample)`;
  $("#list").innerHTML = view === "list"
    ? `<table class="w-full"><thead class="text-left text-[11px] uppercase tracking-wide text-neutral-500 border-b border-neutral-200"><tr><th class="p-2 w-16"></th><th class="p-2">Model</th><th class="p-2">Title</th><th class="p-2">Code</th><th class="p-2">Material</th><th class="p-2">Colour</th><th class="p-2">Category</th></tr></thead><tbody>${list.map((g) => `
        <tr data-i="${D.garments.indexOf(g)}" class="border-b border-neutral-100 hover:bg-amber-50 cursor-pointer">
          <td class="p-1.5"><img src="${g.images[0]}" class="w-12 h-12 object-cover rounded bg-neutral-100"></td>
          <td class="p-2 mono font-medium">${g.model}</td><td class="p-2">${g.title}</td>
          <td class="p-2 mono text-[11px] text-neutral-600 whitespace-nowrap">${g.code[0]}<br>${g.code[1]}</td>
          <td class="p-2 text-neutral-600">${g.material.slice(1).join(" › ")}</td>
          <td class="p-2 text-neutral-600">${g.color.join(" › ")}</td>
          <td class="p-2 text-neutral-600">${g.category.at(-1)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="grid grid-cols-3 lg:grid-cols-6 gap-3 p-3">${list.map((g) => `<div data-i="${D.garments.indexOf(g)}" class="cursor-pointer"><img src="${g.images[0]}" class="aspect-square w-full object-cover rounded bg-neutral-100"><p class="mt-1 leading-tight">${g.title}</p><p class="mono text-[10px] text-neutral-500">${g.code[0]}</p></div>`).join("")}</div>`;
}
function open(g) {
  $("#d-cat").textContent = g.category.join(" › ");
  $("#d-title").textContent = g.title;
  $("#d-code").innerHTML = g.code.join(" &nbsp; ");
  $("#d-images").innerHTML = g.images.map((u) => `<img src="${u}" class="h-56 rounded bg-neutral-100">`).join("");
  $("#d-attrs").innerHTML = row("Model", `${g.model} – ${g.title}`) + row("Material", g.material) + row("Colour", g.color) + row("Type", g.type) + row("Gender", g.gender) + row("Procedure", g.procedure.join(", ")) + row("Process", g.process.join(", "));
  $("#d-source").textContent = `${g.source} listing ↗`; $("#d-source").href = g.url;
  $("#detail").classList.remove("hidden");
}
fetch("/data").then((r) => r.json()).then((d) => {
  D = d;
  $("#filters").innerHTML = tree("Category", "category", d.categories) + tree("Colour", "color", d.colorFamilies) + tree("Material", "material", d.materialGroups);
  $("#filters").addEventListener("change", (e) => { const k = e.target.dataset.k; if (!k) return; active[k] ??= new Set(); e.target.checked ? active[k].add(e.target.value) : active[k].delete(e.target.value); render(); });
  $("#list").onclick = (e) => { const r = e.target.closest("[data-i]"); if (r) open(D.garments[r.dataset.i]); };
  $("#close").onclick = () => $("#detail").classList.add("hidden");
  $("#vList").onclick = () => { view = "list"; $("#vList").className = "px-3 py-1 bg-neutral-900 text-white"; $("#vGrid").className = "px-3 py-1"; render(); };
  $("#vGrid").onclick = () => { view = "grid"; $("#vGrid").className = "px-3 py-1 bg-neutral-900 text-white"; $("#vList").className = "px-3 py-1"; render(); };
  render();
});
</script>
</body>
</html>
